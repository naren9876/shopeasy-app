# Nginx Configuration for Retail API Gateway
# This file routes requests to appropriate microservices

events {
    worker_connections 1024;
}

http {
    upstream account_service {
        server account-service:5000;
    }

    upstream payment_service {
        server payment-service:5001;
    }

    upstream loyalty_service {
        server loyalty-service:5002;
    }

    upstream checkout_service {
        server checkout-service:5003;
    }

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/json;
    gzip_min_length 1000;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=payment:10m rate=5r/s;

    server {
        listen 80;
        server_name api.retail.local localhost;

        # Request timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer sizes
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # Metrics endpoint
        location /metrics {
            access_log off;
            return 200 "Nginx Gateway OK";
            add_header Content-Type text/plain;
        }

        # API documentation
        location /api/docs {
            return 200 '
{
    "name": "Retail Microservices API",
    "version": "1.0.0",
    "services": {
        "account": "http://localhost/account",
        "payment": "http://localhost/payment",
        "loyalty": "http://localhost/loyalty",
        "checkout": "http://localhost/checkout"
    }
}
            ';
            add_header Content-Type application/json;
        }

        # ACCOUNT SERVICE ROUTES
        location /account {
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://account_service;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Service-Name account-service;
            
            # Keep-alive
            proxy_set_header Connection "";
            proxy_http_version 1.1;
        }

        location /auth {
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://account_service;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Service-Name account-service;
            proxy_set_header Connection "";
        }

        location /users {
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://account_service;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Service-Name account-service;
            proxy_set_header Connection "";
        }

        # PAYMENT SERVICE ROUTES
        location /payment {
            limit_req zone=payment burst=10 nodelay;
            
            proxy_pass http://payment_service;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Service-Name payment-service;
            proxy_set_header Connection "";
            
            # Longer timeout for payment operations
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location /payments {
            limit_req zone=payment burst=10 nodelay;
            
            proxy_pass http://payment_service;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Service-Name payment-service;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # LOYALTY SERVICE ROUTES
        location /loyalty {
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://loyalty_service;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Service-Name loyalty-service;
            proxy_set_header Connection "";
        }

        location /rewards {
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://loyalty_service;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Service-Name loyalty-service;
            proxy_set_header Connection "";
        }

        # CHECKOUT SERVICE ROUTES
        location /checkout {
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://checkout_service;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Service-Name checkout-service;
            proxy_set_header Connection "";
        }

        location /cart {
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://checkout_service;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Service-Name checkout-service;
            proxy_set_header Connection "";
        }

        location /orders {
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://checkout_service;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Service-Name checkout-service;
            proxy_set_header Connection "";
        }

        # Default route
        location / {
            return 404 '{"error": "Not Found", "message": "Use /health for health check or /api/docs for API documentation"}';
            add_header Content-Type application/json;
        }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /404.html {
            return 404 '{"error": "Not Found"}';
            add_header Content-Type application/json;
        }

        location = /50x.html {
            return 500 '{"error": "Internal Server Error"}';
            add_header Content-Type application/json;
        }
    }

    # Server for monitoring/status
    server {
        listen 8080;
        server_name localhost;

        # Nginx stats endpoint
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;  # Allow internal connections
            deny all;
        }
    }
}
