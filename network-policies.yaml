apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: retail
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-retail
  namespace: retail
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-health-checks
  namespace: retail
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock: { cidr: 130.211.0.0/22 }
        - ipBlock: { cidr: 35.191.0.0/16 }
