# Docker Compose for Local Testing
# Run with: docker-compose up -d
# Access services at: http://localhost:PORT

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:13-alpine
    container_name: retail-postgres
    environment:
      POSTGRES_DB: retail_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (optional)
  redis:
    image: redis:7-alpine
    container_name: retail-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Account Service
  account-service:
    build:
      context: .
      dockerfile: Dockerfile.account
    container_name: retail-account
    ports:
      - "5000:5000"
    environment:
      SERVICE_NAME: account-service
      SERVICE_VERSION: 1.0.0
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: retail_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retail-network
    restart: unless-stopped

  # Payment Service
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.payment
    container_name: retail-payment
    ports:
      - "5001:5001"
    environment:
      SERVICE_NAME: payment-service
      SERVICE_VERSION: 1.0.0
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      PAYMENT_GATEWAY: stripe
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: retail_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retail-network
    restart: unless-stopped

  # Loyalty Service
  loyalty-service:
    build:
      context: .
      dockerfile: Dockerfile.loyalty
    container_name: retail-loyalty
    ports:
      - "5002:5002"
    environment:
      SERVICE_NAME: loyalty-service
      SERVICE_VERSION: 1.0.0
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      POINTS_MULTIPLIER: 1.0
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: retail_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retail-network
    restart: unless-stopped

  # Checkout Service
  checkout-service:
    build:
      context: .
      dockerfile: Dockerfile.checkout
    container_name: retail-checkout
    ports:
      - "5003:5003"
    environment:
      SERVICE_NAME: checkout-service
      SERVICE_VERSION: 1.0.0
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      TAX_RATE: 0.08
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: retail_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retail-network
    restart: unless-stopped

  # Nginx API Gateway (Optional)
  nginx:
    image: nginx:alpine
    container_name: retail-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - account-service
      - payment-service
      - loyalty-service
      - checkout-service
    networks:
      - retail-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  retail-network:
    driver: bridge
